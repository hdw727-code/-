<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🧭 나의 진로 여행</title>
<style>
  :root{
    --grad: linear-gradient(160deg,#f59e0b,#f4737f 55%,#e85d9b);
    --egrad: linear-gradient(160deg,#4f46e5,#7c3aed 55%,#db2777);
    --rgrad: linear-gradient(160deg,#059669,#0ea5e9);
    --ink:#1e1b3a; --sub:#6b7280; --card:#ffffff; --line:#e5e7eb;
    --blue:#4f46e5; --pink:#db2777; --amber:#b45309;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,sans-serif; background:var(--grad); color:var(--ink); display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; transition:background .5s;}
  body.election{background:var(--egrad);}
  .app{width:100%; max-width:440px;}
  .card{background:var(--card); border-radius:22px; padding:24px 20px; box-shadow:0 14px 40px rgba(20,10,60,.35); animation:pop .3s ease;}
  @keyframes pop{from{transform:translateY(14px) scale(.98); opacity:0;} to{transform:none; opacity:1;}}
  h1{font-size:21px; line-height:1.4; text-align:center;}
  h2{font-size:18px; margin-bottom:4px; line-height:1.4;}
  .big-emoji{font-size:52px; text-align:center; display:block; margin-bottom:8px;}
  .desc{font-size:14px; color:var(--sub); line-height:1.65; text-align:center; margin-top:10px;}
  .hint{font-size:12.5px; color:var(--sub); line-height:1.55; margin-bottom:8px;}
  .notice{margin-top:14px; background:#fff7e8; color:#8a5a12; font-size:12.5px; border-radius:12px; padding:10px 12px; line-height:1.55; text-align:center;}
  button{font-family:inherit; cursor:pointer; border:none;}
  .btn{display:block; width:100%; padding:15px; border-radius:16px; font-size:16px; font-weight:800; margin-top:14px; background:var(--grad); color:#fff; box-shadow:0 6px 18px rgba(180,90,20,.35); transition:transform .1s;}
  body.election .btn{background:var(--egrad); box-shadow:0 6px 18px rgba(79,70,229,.4);}
  .btn.green{background:var(--rgrad) !important;}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:#f3f4f6 !important; color:var(--sub); box-shadow:none; font-weight:600; font-size:13.5px; padding:11px;}
  .btn:disabled{opacity:.45; box-shadow:none;}
  .jprog{display:flex; gap:5px; margin-bottom:14px;}
  .jprog span{flex:1; height:6px; border-radius:3px; background:#f1f5f9; transition:background .3s;}
  .jprog span.on{background:#f59e0b;}
  body.election .jprog span.on{background:var(--blue);}
  .jq-opt{display:block; width:100%; text-align:left; padding:13px 14px; border:2px solid var(--line); border-radius:12px; background:#fff; font-size:14px; margin-top:8px; cursor:pointer; font-family:inherit; line-height:1.5;}
  .jq-opt.sel{border-color:#f59e0b; background:#fff7e8; font-weight:700;}
  .type-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(76px,1fr)); gap:7px; margin-top:10px;}
  .type-card{border:2px solid var(--line); border-radius:12px; padding:9px 4px; background:#fff; cursor:pointer; font-size:12px; text-align:center; font-weight:700; font-family:inherit; word-break:keep-all;}
  .type-card .te{display:block; font-size:20px; margin-bottom:3px;}
  .type-card.sel{border-color:#f59e0b; background:#fff7e8;}
  .type-card.reco{box-shadow:0 0 0 2px #fde68a;}
  .type-detail{background:#fffdf5; border:1.5px dashed #f0b95e; border-radius:12px; padding:12px 14px; margin-top:10px; font-size:13px; line-height:1.65; color:#6b4d10; min-height:60px;}
  .type-warn{background:#fef2f2; border:1.5px solid #fca5a5; border-radius:12px; padding:10px 12px; margin-top:10px; font-size:12.5px; line-height:1.6; color:#991b1b;}
  .reco-box{background:linear-gradient(120deg,#fff7e8,#fdeef5); border-radius:14px; padding:13px; margin-top:10px; text-align:center; line-height:1.65; font-size:13.5px;}
  .field{margin-top:12px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--sub); margin-bottom:5px;}
  .field input, .field textarea, .field select{width:100%; font-family:inherit; font-size:15px; padding:12px 13px; border:2px solid var(--line); border-radius:12px; background:#fafafa;}
  .field input:focus, .field textarea:focus{outline:none; border-color:#f59e0b; background:#fff;}
  body.election .field input:focus, body.election .field textarea:focus{border-color:var(--blue);}
  .err{color:#dc2626; font-size:13px; margin-top:8px; min-height:18px; font-weight:600;}
  .jsum{border:3px solid #f59e0b; border-radius:14px; overflow:hidden; margin-top:10px;}
  .jsum .h{background:var(--grad); color:#fff; padding:12px; text-align:center; font-weight:800; font-size:15px;}
  .jsum .b{padding:12px 15px; font-size:13.5px; line-height:1.85; background:#fffdf7;}
  .jsum .b .lbl{color:var(--amber); font-weight:700; font-size:11.5px;}
  .jnav{display:flex; gap:10px; margin-top:14px;}
  .jnav button{border-radius:14px;}
  .jnav .back{background:#f3f4f6; color:var(--sub); padding:13px 18px; font-size:15px;}
  .jnav .next{flex:1; background:var(--grad); color:#fff; padding:13px; font-size:15.5px; font-weight:800;}
  body.election .jnav .next{background:var(--egrad);}
  .pos-cards{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
  .pos-card{background:#f8f7ff; border:3px solid transparent; border-radius:18px; padding:20px 8px; text-align:center; font-size:15px; font-weight:800; color:var(--ink); line-height:1.5;}
  .pos-card .pe{font-size:38px; display:block; margin-bottom:6px;}
  .pos-card.sel{border-color:var(--blue); background:#eef2ff;}
  .poster{border:4px solid var(--ink); border-radius:16px; overflow:hidden; margin-top:12px;}
  .poster .p-head{background:var(--egrad); color:#fff; text-align:center; padding:14px 10px;}
  .poster .p-head .p-pos{font-size:12px; font-weight:700; letter-spacing:4px; opacity:.9;}
  .poster .p-head .p-name{font-size:24px; font-weight:900; margin-top:3px;}
  .poster .p-head .p-num{font-size:12px; opacity:.85; margin-top:2px;}
  .poster .p-body{padding:13px 15px; background:#fffdf5;}
  .poster .p-title{font-size:11.5px; font-weight:800; color:var(--pink); letter-spacing:2px; margin-bottom:7px;}
  .poster ol{padding-left:18px; font-size:14px; line-height:1.7; font-weight:600;}
  .poster .p-motto{margin-top:10px; font-size:13.5px; font-style:italic; color:#374151; border-top:1px dashed #d1d5db; padding-top:9px; text-align:center;}
  .pledge-row{display:flex; align-items:center; gap:8px; margin-top:9px;}
  .pledge-row .no{font-size:17px; flex-shrink:0;}
  .pledge-row input{flex:1; font-family:inherit; font-size:14.5px; padding:11px 12px; border:2px solid var(--line); border-radius:12px; background:#fafafa;}
  .done-wrap{text-align:center; padding:8px 0;}
  .done-wrap .big-emoji{animation:bounce .6s ease infinite alternate;}
  @keyframes bounce{from{transform:translateY(0);} to{transform:translateY(-8px);}}
  .confetti{position:fixed; top:-20px; font-size:22px; animation:fall linear forwards; z-index:99; pointer-events:none;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
  .foot{margin-top:14px; text-align:center; font-size:11.5px; color:rgba(255,255,255,.8); line-height:1.6;}
</style>
</head>
<body>
<div class="app">
  <div class="jprog" id="prog"></div>
  <div class="card" id="stage"></div>
  <div class="foot">우리 반 진로 조사 · 제출 내용은 담임 선생님만 확인합니다</div>
</div>

<!-- 구글 폼 전송용 (숨김) -->
<iframe name="gform_frame" id="gframe" style="display:none"></iframe>
<form id="gform" action="https://docs.google.com/forms/d/e/1FAIpQLSc-pAaF0yWWa6cR8dw4fwNmERVWcMxCT0xyv5zZ9T-PeErldw/formResponse"
      method="POST" target="gform_frame" style="display:none">
  <input name="entry.1133997056" id="g_num">
  <input name="entry.799271606" id="g_name">
  <input name="entry.1208240749" id="g_pos">
  <textarea name="entry.1017716931" id="g_pledge"></textarea>
  <input name="entry.1062155294" id="g_motto">
</form>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LSJ = 'unified_jinhak_v1';       // 이 폰에서 마지막으로 쓴 진학 답 (수정용)
const LSE = 'unified_election_done';   // 선거 참여/노출 완료 플래그

/* ---------- 고교 유형 데이터 (경기·시흥 비평준화 기준) ---------- */
const TYPES = [
  {name:'일반고', emoji:'🏫', period:'후기', hint:'후기 · 12월 초 원서 · 내신 200점 석차순(시흥 비평준화)',
   desc:'대학 진학을 목표로 공부하는 가장 일반적인 고등학교. 시흥의 서해고·함현고(자공고)도 같은 방식이야.',
   fit:'대학 진학을 목표로 차근차근 공부하고 싶은 친구',
   warn:'시흥은 비평준화! 일반고도 내신 200점 석차순으로 뽑고 후기에 딱 1개 학교만 지원할 수 있어. 내 내신으로 갈 수 있는지 꼭 확인하고 선생님과 상담하자!'},
  {name:'특성화고', emoji:'🔧', period:'전기', hint:'전기 · 특별전형 11월 초 → 일반전형 11월 중순',
   desc:'요리·IT·디자인·회계 같은 전문 분야를 실습 중심으로 배워. 취업도, 특성화고 전형으로 대학도 갈 수 있어.',
   fit:'하고 싶은 분야가 있고 실습으로 배우는 게 좋은 친구',
   warn:'전기모집 1개교! 특별전형에서 떨어지면 일반전형에 다시 지원할 수 있어. 최종 불합격 시 후기 일반고 1개교 지원 — 그것도 내신순이라 2지망 계획 필수.'},
  {name:'마이스터고', emoji:'⚙️', period:'전기', hint:'전기 · 10월 하순 원서 · 전국 모집·기숙사',
   desc:'산업 분야별 기술 명장을 키우는 학교. 전국 모집·기숙사 생활, 취업률이 아주 높아.',
   fit:'기술로 승부하고 빨리 사회에 나가고 싶은 친구',
   warn:'전기 1개교 원칙 — 합격하면 다른 학교 지원 불가. 불합격 확정 시 특성화고 재지원 가능. 10월 하순 원서!'},
  {name:'과학고', emoji:'🔬', period:'전기', hint:'전기 · 8월 말 원서(경기북과학고)',
   desc:'수학·과학 심화 학교. 경기는 경기북과학고 — 원서가 8월 말!',
   fit:'수학·과학이 정말 좋고 성적이 뒷받침되는 친구',
   warn:'원서가 8월 말이라 지금 당장 결정해야 해! 합격하면 후기고(일반고 포함) 지원 불가. 오늘 선생님·부모님과 상의하자.'},
  {name:'외고·국제고', emoji:'🌍', period:'후기', hint:'후기 · 12월 초 원서 · 자기주도학습전형(면접)',
   desc:'외국어·국제 분야 심화 학교. 영어 내신과 면접으로 선발해.',
   fit:'언어 배우는 게 즐겁고 영어에 자신 있는 친구',
   warn:'아주 중요: 경기도에서 외고·국제고 지원자는 시흥 같은 비평준화 일반고와 동시지원이 안 돼! 불합격하면 1월 추가모집으로 가야 해. 꼭 선생님과 전략 상의!'},
  {name:'자사고', emoji:'🎓', period:'후기', hint:'후기 · 12월 초 원서 · 자기주도학습전형',
   desc:'자율 교육과정 사립고. 프로그램이 다양하지만 학비가 더 들어.',
   fit:'공부 분위기 잡힌 곳에서 대입에 집중하고 싶은 친구',
   warn:'자사고도 시흥 비평준화 일반고와 동시지원 불가! 불합격 시 1월 추가모집. 학비도 더 들어. 선생님과 꼭 상의하자.'},
  {name:'예술·체육고', emoji:'🎨', period:'전기', hint:'전기 · 10월 중순 원서 · 실기 필수',
   desc:'예술·체육 전공 실기 중심 학교. 실기 준비가 필수야.',
   fit:'예체능 진로를 정하고 연습해 온 친구',
   warn:'전기모집(1개교) + 10월 중순 원서 + 실기시험. 준비 일정을 지금 확인하자. 합격하면 후기 지원 불가!'},
  {name:'미정', emoji:'🤔', period:'', hint:'',
   desc:'아직 못 정해도 괜찮아! 오늘 생각을 남겨두고 선생님과 같이 찾아보자.', fit:'', warn:''},
];
const tinfo = n => TYPES.find(t=>t.name===n) || TYPES[TYPES.length-1];

const QUIZ = [
  {q:'공부는 어떤 방식이 제일 잘 맞아?', sub:'정답은 없어. 솔직하게 골라줘!',
   opts:[
    {t:'📖 책상에 앉아 개념을 파고드는 공부', w:{'일반고':2,'자사고':1,'과학고':1}},
    {t:'🔧 직접 만들고 실습하며 배우는 공부', w:{'특성화고':2,'마이스터고':2}},
    {t:'🎨 몸으로 표현하고 연습하는 공부', w:{'예술·체육고':2}},
   ]},
  {q:'대학 진학, 지금 네 생각은?', sub:'중간에 생각이 바뀌어도 전혀 문제없어.',
   opts:[
    {t:'🎓 대학은 꼭 가고 싶어', w:{'일반고':2,'자사고':1,'외고·국제고':1,'과학고':1}},
    {t:'💼 먼저 취업하고, 대학은 필요할 때 가도 돼', w:{'특성화고':2,'마이스터고':2}},
    {t:'🤔 아직 잘 모르겠어', w:{}},
   ]},
  {q:'제일 자신 있거나 좋아하는 과목은?', sub:'좋아하는 것에서 진로의 힌트가 나와.',
   opts:[
    {t:'🔬 수학·과학', w:{'과학고':2,'일반고':1}},
    {t:'🌍 영어·외국어', w:{'외고·국제고':2,'일반고':1}},
    {t:'⚙️ 기술·가정, 실습 과목', w:{'특성화고':2,'마이스터고':1}},
    {t:'⚽ 음악·미술·체육', w:{'예술·체육고':2}},
    {t:'📚 골고루 비슷해', w:{'일반고':2}},
   ]},
  {q:'집에서 멀거나 기숙사 생활도 괜찮아?', sub:'마이스터고·전국 자사고 등은 기숙사 생활을 해.',
   opts:[
    {t:'🏠 집 가까운 학교가 좋아', w:{'일반고':1,'특성화고':1}},
    {t:'🚄 나에게 맞는 학교라면 기숙사도 괜찮아', w:{'마이스터고':1,'과학고':1,'자사고':1}},
   ]},
];

/* ---------- 상태 ---------- */
// 단계: 0 인사 · 1 번호이름 · 2~5 질문 · 6 유형 · 7 학교 · 8 선생님께 · 9 진로카드(제출)
//       10 선거 안내 · 11 출마 or 추천 흐름 · 12 완료
const PROG_TOTAL = 12;
let st = {step:0, num:'', name:'', q:[null,null,null,null], type:'미정', viewType:null,
          s1:'', m1:'', s2:'', m2:'', reason:'', ask:''};
let jinhakSubmitted = false;
let electionMode = null;   // 'run' | 'reco'
let ed = null;             // 선거 하위 상태
let posting = false;

try{ const saved = JSON.parse(localStorage.getItem(LSJ)); if(saved) st = Object.assign(st, saved, {step:0}); }catch(e){}
const electionDone = () => { try{ return localStorage.getItem(LSE)==='1'; }catch(e){ return false; } };
const markElectionDone = () => { try{ localStorage.setItem(LSE,'1'); }catch(e){} };
const saveDraft = () => { try{ localStorage.setItem(LSJ, JSON.stringify(st)); }catch(e){} };

/* ---------- 공통 ---------- */
function prog(i){
  $('prog').innerHTML = Array.from({length:PROG_TOTAL},(_,k)=>`<span class="${k<=i?'on':''}"></span>`).join('');
}
function nav(backFn, nextLabel, nextFn){
  return `<div class="jnav">
    <button class="back" onclick="${backFn}">←</button>
    <button class="next" onclick="${nextFn}">${nextLabel}</button>
  </div>`;
}
function gv(id){ const el=$(id); return el?el.value.trim():undefined; }
function saveFields(){
  const n=gv('fNum'); if(n!==undefined){ st.num=n; st.name=gv('fName'); }
  const s1=gv('jS1'); if(s1!==undefined){ st.s1=s1; st.m1=gv('jM1'); st.s2=gv('jS2'); st.m2=gv('jM2'); st.reason=gv('jReason'); }
  const a=gv('jAsk'); if(a!==undefined) st.ask=a;
  saveDraft();
}
function recommend(){
  const score={};
  st.q.forEach((a,i)=>{ if(a===null) return; const w=QUIZ[i].opts[a].w; for(const k in w) score[k]=(score[k]||0)+w[k]; });
  return Object.entries(score).sort((a,b)=>b[1]-a[1]).filter(e=>e[1]>0).slice(0,2).map(e=>e[0]);
}
function doPost(values, onDone){
  if(posting) return; posting = true;
  $('g_num').value=values.num; $('g_name').value=values.name; $('g_pos').value=values.pos;
  $('g_pledge').value=values.pledge; $('g_motto').value=values.motto;
  let finished=false;
  const finish=()=>{ if(finished) return; finished=true; posting=false; onDone(); };
  $('gframe').addEventListener('load', finish, {once:true});
  setTimeout(finish, 2500);
  $('gform').submit();
}
function confetti(){
  const emo=['🎉','🎊','⭐','🧭','💜','🌟'];
  for(let i=0;i<32;i++){
    const s=document.createElement('span'); s.className='confetti'; s.textContent=emo[i%emo.length];
    s.style.left=Math.random()*100+'vw'; s.style.animationDuration=(2+Math.random()*2)+'s'; s.style.animationDelay=(Math.random()*0.8)+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(),5000);
  }
}
function pickOpt(qi,oi){ st.q[qi]=oi; saveDraft(); st.step=qi+3<=5 ? qi+3 : 6; render(); }
function pickType(n){ st.type=n; st.viewType=n; saveDraft(); render(); }

/* ---------- 렌더 ---------- */
function render(){
  document.body.classList.toggle('election', st.step>=10);
  const box=$('stage');
  const s=st.step;
  prog(Math.min(s,PROG_TOTAL-1));

  if(s===0){
    const hasOld = st.name && (st.s1||st.reason||st.type!=='미정');
    box.innerHTML = `
      <span class="big-emoji">🧭</span>
      <h1>나의 진로 여행</h1>
      <p class="desc">고등학교 진학을 <b>진지하게</b> 생각해보는 시간이야.<br>5분이면 충분해. 정답은 없으니 솔직하게만!<br>${electionDone()?'':'마지막에는 <b>반장·부반장 선거</b> 참여도 있어 🗳'}</p>
      ${hasOld?`<div class="notice">📝 지난번에 쓴 내용이 이 폰에 남아 있어 — 이어서 고칠 수 있어!</div>`:''}
      <button class="btn" onclick="st.step=1;render()">🚀 시작하기</button>
      <div class="notice">🔒 여기 쓴 내용은 <b>담임 선생님만</b> 확인해요.</div>`;
  }
  else if(s===1){
    box.innerHTML = `
      <h2>먼저, 누구인가요? 😊</h2>
      <div class="field"><label>번호</label><input id="fNum" type="number" inputmode="numeric" min="1" max="99" value="${esc(st.num)}" placeholder="예: 7"></div>
      <div class="field"><label>이름</label><input id="fName" type="text" maxlength="15" value="${esc(st.name)}" placeholder="이름을 입력하세요"></div>
      <div class="err" id="err1"></div>
      ${nav('st.step=0;render()','다음 →','next1()')}`;
  }
  else if(s>=2 && s<=5){
    const qi=s-2, Q=QUIZ[qi];
    box.innerHTML = `
      <div class="hint">나를 돌아보기 ${qi+1} / ${QUIZ.length}</div>
      <h2>${Q.q}</h2>
      <div class="hint">${Q.sub}</div>
      ${Q.opts.map((o,oi)=>`<button class="jq-opt ${st.q[qi]===oi?'sel':''}" onclick="pickOpt(${qi},${oi})">${o.t}</button>`).join('')}
      <div class="jnav"><button class="back" onclick="st.step=${s-1};render()">←</button><span style="flex:1"></span></div>`;
  }
  else if(s===6){
    const reco=recommend();
    const view=st.viewType?tinfo(st.viewType):null;
    box.innerHTML = `
      ${reco.length?`<div class="reco-box">네 답을 보니…<br><b>${reco.map(r=>tinfo(r).emoji+' '+r).join(' / ')}</b> 쪽이 어울릴 수도!<br><span style="font-size:11.5px;color:#9a6b1e">참고만 해줘 — 결정은 언제나 네 몫이야 😊</span></div>`
        :`<div class="reco-box">아직 방향이 안 보여도 <b>전혀 괜찮아!</b> 🌱<br><span style="font-size:11.5px;color:#9a6b1e">카드를 하나씩 읽어보며 천천히 찾아보자.</span></div>`}
      <h2 style="margin-top:12px">고등학교 유형 탐색 🔍</h2>
      <div class="hint">카드를 눌러 읽어보고 <b>나의 희망 유형</b>을 골라줘. (미정도 OK)</div>
      <div class="type-grid">
        ${TYPES.map(t=>`<button class="type-card ${st.type===t.name?'sel':''} ${reco.includes(t.name)?'reco':''}" onclick="pickType('${t.name}')"><span class="te">${t.emoji}</span>${t.name}</button>`).join('')}
      </div>
      <div class="type-detail">${view?`<b>${view.emoji} ${view.name}</b> — ${view.desc}${view.fit?`<br>💡 이런 친구에게: ${view.fit}`:''}${view.hint?`<br>🗓 ${view.hint}`:''}`:'카드를 누르면 설명이 여기에!'}</div>
      ${view&&view.warn?`<div class="type-warn">⚠️ <b>꼭 알아둬!</b> ${view.warn}</div>`:''}
      ${nav('st.step=5;render()','이 유형으로 할래 →','st.step=7;render()')}`;
  }
  else if(s===7){
    const t=tinfo(st.type);
    box.innerHTML = `
      <h2>가고 싶은 학교 🏫</h2>
      <div class="hint">떠오르는 학교가 있으면 적어줘. 아직 없으면 비워도 돼.</div>
      ${st.type==='일반고'?`<div class="type-warn">⚠️ 시흥은 비평준화 — 일반고도 <b>내신 200점 석차순</b>, 실제 원서는 <b>후기 1개교</b>! 1지망은 "가고 싶고 갈 수 있는 학교", 2지망은 "만약을 대비한 학교"로.</div>`:''}
      ${t.period==='전기'?`<div class="type-warn">⚠️ ${esc(st.type)}는 <b>전기 — 딱 1개 학교</b>만 지원 가능! 2지망 칸에는 불합격 대비 후기(일반고) 계획을 적어줘.</div>`:''}
      <div class="field"><label>1지망 학교</label><input id="jS1" maxlength="20" value="${esc(st.s1)}" placeholder="예: ○○고등학교"></div>
      <div class="field"><label>1지망 학과 (특성화·마이스터고만)</label><input id="jM1" maxlength="20" value="${esc(st.m1)}"></div>
      <div class="field"><label>2지망 학교</label><input id="jS2" maxlength="20" value="${esc(st.s2)}"></div>
      <div class="field"><label>2지망 학과</label><input id="jM2" maxlength="20" value="${esc(st.m2)}"></div>
      <div class="field"><label>이 학교(유형)를 고른 이유</label><textarea id="jReason" rows="2" maxlength="150" placeholder="예: 배우고 싶은 과목이 있어서">${esc(st.reason)}</textarea></div>
      ${nav('saveFields();st.step=6;render()','다음 →','saveFields();st.step=8;render()')}`;
  }
  else if(s===8){
    box.innerHTML = `
      <h2>선생님께 하고 싶은 말 💌</h2>
      <div class="hint">지금 제일 고민되는 것, 궁금한 것 — 뭐든 좋아.<br>선생님이 읽고 <b>상담할 때 꼭 챙겨줄게.</b></div>
      <div class="field"><textarea id="jAsk" rows="3" maxlength="200" placeholder="예: 내신이 낮은데 특성화고 갈 수 있을까요? / 아직 하고 싶은 게 없어요">${esc(st.ask)}</textarea></div>
      ${nav('saveFields();st.step=7;render()','다음 →','saveFields();st.step=9;render()')}`;
  }
  else if(s===9){
    const t=tinfo(st.type);
    box.innerHTML = `
      <h2>나의 진로 카드 ✅</h2>
      <div class="hint">이대로 제출할까? 고칠 게 있으면 ←로 돌아가면 돼.</div>
      <div class="jsum">
        <div class="h">${t.emoji} ${esc(st.name)}의 진로 카드</div>
        <div class="b">
          <span class="lbl">희망 유형</span><br>${t.emoji} ${esc(st.type)}${t.period?` <span style="font-size:11px;color:#9a6b1e">(${t.period}모집)</span>`:''}<br>
          <span class="lbl">1지망</span><br>${st.s1?esc(st.s1)+(st.m1?' · '+esc(st.m1):''):'아직 고민 중'}<br>
          ${st.s2?`<span class="lbl">2지망</span><br>${esc(st.s2)}${st.m2?' · '+esc(st.m2):''}<br>`:''}
          ${st.reason?`<span class="lbl">이유</span><br>${esc(st.reason)}<br>`:''}
          ${st.ask?`<span class="lbl">선생님께</span><br>${esc(st.ask)}`:''}
        </div>
      </div>
      ${t.warn?`<div class="type-warn">⚠️ <b>제출 전에 한 번 더!</b> ${t.warn}</div>`:''}
      <div class="err" id="err9"></div>
      ${nav('st.step=8;render()','📮 제출하기','submitJinhak()')}`;
  }
  else if(s===10){
    if(electionDone()){ st.step=12; render(); return; }
    box.innerHTML = `
      <span class="big-emoji">🗳️</span>
      <h1>마지막으로, 반장·부반장 선거!</h1>
      <p class="desc">2학기 우리 반 리더를 찾고 있어.<br>직접 출마해도, 어울리는 친구를 추천해도 좋아.<br><b>이 화면은 딱 한 번만</b> 나와 — 지금 정해줘!</p>
      <button class="btn" onclick="electionMode='run';ed={step:0,pos:'',p:['','',''],motto:''};st.step=11;render()">🙋 내가 출마할래요</button>
      <button class="btn green" onclick="electionMode='reco';ed={step:0,pos:'반장',fnum:'',fname:'',reason:'',me:''};st.step=11;render()">👍 친구를 추천할래요</button>
      <button class="btn ghost" onclick="markElectionDone();st.step=12;render()">이번엔 넘어갈래요 (다시 안 나와요)</button>`;
  }
  else if(s===11){
    renderElection(box);
  }
  else if(s===12){
    box.innerHTML = `
      <div class="done-wrap">
        <span class="big-emoji">🌟</span>
        <h2 style="text-align:center">모두 끝났어요!</h2>
        <p class="desc"><b>${esc(st.name)}</b>, 오늘 진지하게 고민해줘서 고마워.<br>네 꿈을 항상 응원할게 — 궁금한 건 언제든 선생님께! 😊</p>
        <button class="btn ghost" onclick="location.reload()">처음 화면으로</button>
      </div>`;
    confetti();
  }
}

/* ---------- 진학 검증·제출 ---------- */
function next1(){
  st.num=gv('fNum'); st.name=gv('fName');
  if(!st.num||!st.name){ $('err1').textContent='번호와 이름을 모두 입력해줘!'; return; }
  const n=Number(st.num);
  if(!Number.isInteger(n)||n<1||n>99){ $('err1').textContent='번호는 1~99 사이 숫자로!'; return; }
  saveDraft(); st.step=2; render();
}
function submitJinhak(){
  if(jinhakSubmitted){ st.step=10; render(); return; }
  const reco=recommend();
  const pledge = `유형: ${st.type}\n1지망: ${st.s1||'미정'}${st.m1?'('+st.m1+')':''}\n2지망: ${st.s2||'-'}${st.m2?'('+st.m2+')':''}\n이유: ${st.reason||'-'}`;
  const motto = `자기진단: ${reco.join('/')||'-'} | 선생님께: ${st.ask||'-'}`;
  const btns=document.querySelectorAll('.jnav .next'); btns.forEach(b=>{b.disabled=true;b.textContent='제출 중...';});
  doPost({num:st.num, name:'(진학) '+st.name, pos:'', pledge, motto}, ()=>{
    jinhakSubmitted=true; saveDraft(); st.step=10; render();
  });
}

/* ---------- 선거 ---------- */
function renderElection(box){
  if(electionMode==='run') renderRun(box); else renderReco(box);
}
function renderRun(box){
  if(ed.step===0){
    box.innerHTML = `
      <h2>어디에 도전할까? 🙋</h2>
      <div class="pos-cards">
        <button class="pos-card ${ed.pos==='반장'?'sel':''}" onclick="ed.pos='반장';render()"><span class="pe">🎖️</span>반장</button>
        <button class="pos-card ${ed.pos==='부반장'?'sel':''}" onclick="ed.pos='부반장';render()"><span class="pe">🤝</span>부반장</button>
      </div>
      <div class="err" id="eErr"></div>
      ${nav('st.step=10;render()','다음 →',"ed.pos?(ed.step=1,render()):($('eErr').textContent='직책을 골라줘!')")}`;
  }
  else if(ed.step===1){
    box.innerHTML = `
      <h2>나의 공약 📢</h2>
      <div class="hint">당선되면 하고 싶은 일 1~3가지. 구체적일수록 표가 모여!</div>
      <div class="pledge-row"><span class="no">1️⃣</span><input id="ep1" maxlength="80" value="${esc(ed.p[0])}" placeholder="예: 아침마다 알림장 정리해서 공지하기"></div>
      <div class="pledge-row"><span class="no">2️⃣</span><input id="ep2" maxlength="80" value="${esc(ed.p[1])}" placeholder="예: 건의함 만들어서 매주 확인하기"></div>
      <div class="pledge-row"><span class="no">3️⃣</span><input id="ep3" maxlength="80" value="${esc(ed.p[2])}" placeholder="예: 한 달에 한 번 학급 놀이 시간"></div>
      <div class="field"><label>각오 한마디 (선택)</label><input id="eMotto" maxlength="100" value="${esc(ed.motto)}" placeholder="한 문장으로!"></div>
      <div class="err" id="eErr"></div>
      ${nav('eSave();ed.step=0;render()','내 포스터 보기 →','eNext1()')}`;
  }
  else if(ed.step===2){
    const ps=ed.p.filter(Boolean);
    box.innerHTML = `
      <h2>나의 선거 포스터 🖼️</h2>
      <div class="poster">
        <div class="p-head">
          <div class="p-pos">${esc(ed.pos)} 후보</div>
          <div class="p-name">${esc(st.name)}</div>
          <div class="p-num">${esc(st.num)}번</div>
        </div>
        <div class="p-body">
          <div class="p-title">MY 공약</div>
          <ol>${ps.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>
          ${ed.motto?`<div class="p-motto">“${esc(ed.motto)}”</div>`:''}
        </div>
      </div>
      ${nav('ed.step=1;render()','✅ 제출하기','submitRun()')}`;
  }
}
function eSave(){
  if($('ep1')){ ed.p=[gv('ep1'),gv('ep2'),gv('ep3')]; ed.motto=gv('eMotto'); }
}
function eNext1(){
  eSave();
  if(!ed.p.filter(Boolean).length){ $('eErr').textContent='공약을 한 가지 이상 적어줘!'; return; }
  ed.step=2; render();
}
function submitRun(){
  const ps=ed.p.filter(Boolean);
  const btns=document.querySelectorAll('.jnav .next'); btns.forEach(b=>{b.disabled=true;b.textContent='제출 중...';});
  doPost({num:st.num, name:st.name, pos:ed.pos,
          pledge:ps.map((p,i)=>(i+1)+'. '+p).join('\n'), motto:ed.motto||''},
    ()=>{ markElectionDone(); st.step=12; render(); });
}
function renderReco(box){
  if(ed.step===0){
    box.innerHTML = `
      <h2>친구 추천하기 👍</h2>
      <div class="hint">반장·부반장이 어울리는 친구를 추천해줘. 추천이 많은 친구에게는 선생님이 살짝 출마를 권해볼게 😊</div>
      <div class="pos-cards">
        <button class="pos-card ${ed.pos==='반장'?'sel':''}" onclick="ed.pos='반장';render()"><span class="pe">🎖️</span>반장</button>
        <button class="pos-card ${ed.pos==='부반장'?'sel':''}" onclick="ed.pos='부반장';render()"><span class="pe">🤝</span>부반장</button>
      </div>
      <div class="field"><label>추천할 친구 번호</label><input id="rNum" type="number" inputmode="numeric" min="1" max="99" value="${esc(ed.fnum)}" placeholder="예: 12"></div>
      <div class="field"><label>추천할 친구 이름</label><input id="rName" maxlength="15" value="${esc(ed.fname)}" placeholder="이름"></div>
      <div class="field"><label>추천하는 이유 (필수)</label><textarea id="rReason" rows="2" maxlength="120" placeholder="예: 친구들 이야기를 잘 들어주고 책임감이 강해서">${esc(ed.reason)}</textarea></div>
      <div class="err" id="rErr"></div>
      ${nav('st.step=10;render()','추천 카드 보기 →','rNext()')}`;
  }
  else if(ed.step===1){
    box.innerHTML = `
      <h2>추천 카드 확인 ✅</h2>
      <div class="poster">
        <div class="p-head" style="background:var(--rgrad)">
          <div class="p-pos">${esc(ed.pos)} 추천</div>
          <div class="p-name">${esc(ed.fname)}</div>
          <div class="p-num">${esc(ed.fnum)}번</div>
        </div>
        <div class="p-body">
          <div class="p-title" style="color:#059669">추천 이유</div>
          <div style="font-size:14px; line-height:1.7; font-weight:600">${esc(ed.reason)}</div>
          <div class="p-motto">추천한 사람: ${esc(st.num)}번 ${esc(st.name)}</div>
        </div>
      </div>
      ${nav('ed.step=0;render()','💝 추천 제출하기','submitRecoFinal()')}`;
  }
}
function rNext(){
  ed.fnum=gv('rNum'); ed.fname=gv('rName'); ed.reason=gv('rReason');
  if(!ed.pos){ $('rErr').textContent='직책을 골라줘!'; return; }
  if(!ed.fnum||!ed.fname){ $('rErr').textContent='친구의 번호와 이름을 입력해줘!'; return; }
  const n=Number(ed.fnum);
  if(!Number.isInteger(n)||n<1||n>99){ $('rErr').textContent='번호는 1~99 사이 숫자로!'; return; }
  if(!ed.reason){ $('rErr').textContent='추천하는 이유를 적어줘!'; return; }
  ed.step=1; render();
}
function submitRecoFinal(){
  const btns=document.querySelectorAll('.jnav .next'); btns.forEach(b=>{b.disabled=true;b.textContent='제출 중...';});
  doPost({num:ed.fnum, name:'(추천) '+ed.fname, pos:ed.pos,
          pledge:'[친구 추천] 이유: '+ed.reason, motto:'추천한 사람: '+st.num+'번 '+st.name},
    ()=>{ markElectionDone(); st.step=12; render(); });
}

render();
</script>
</body>
</html>
