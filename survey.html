<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🧭 나의 진로 여행</title>
<style>
  :root{
    --grad: linear-gradient(160deg,#f59e0b,#f4737f 55%,#e85d9b);
    --ink:#1e1b3a; --sub:#6b7280; --card:#fff; --line:#e5e7eb;
    --amber:#b45309; --red:#b91c1c;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,sans-serif;
    background:var(--grad); color:var(--ink); display:flex; flex-direction:column;
    align-items:center; padding:20px 16px 44px;}
  .app{width:100%; max-width:440px;}
  .card{background:var(--card); border-radius:22px; padding:24px 20px;
    box-shadow:0 14px 40px rgba(20,10,60,.35); animation:pop .3s ease;}
  @keyframes pop{from{transform:translateY(14px) scale(.98); opacity:0;} to{transform:none; opacity:1;}}
  h1{font-size:21px; line-height:1.45; text-align:center;}
  h2{font-size:18px; line-height:1.45; margin-bottom:4px;}
  .big{font-size:52px; text-align:center; display:block; margin-bottom:8px;}
  .desc{font-size:14px; color:var(--sub); line-height:1.7; text-align:center; margin-top:10px;}
  .hint{font-size:12.5px; color:var(--sub); line-height:1.6; margin-bottom:10px;}
  .who{text-align:center; font-size:12.5px; color:#fff; opacity:.9; margin-bottom:12px; font-weight:600;}
  button{font-family:inherit; cursor:pointer; border:none;}
  .btn{display:block; width:100%; padding:15px; border-radius:16px; font-size:16px;
    font-weight:800; margin-top:14px; background:var(--grad); color:#fff;
    box-shadow:0 6px 18px rgba(180,90,20,.35);}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:#f3f4f6; color:var(--sub); box-shadow:none; font-weight:600;
    font-size:13.5px; padding:11px;}
  .btn:disabled{opacity:.45; box-shadow:none;}
  .prog{display:flex; gap:5px; margin-bottom:14px;}
  .prog span{flex:1; height:6px; border-radius:3px; background:#f1f5f9;}
  .prog span.on{background:#f59e0b;}
  .opt{display:block; width:100%; text-align:left; padding:13px 14px; border:2px solid var(--line);
    border-radius:12px; background:#fff; font-size:14px; margin-top:8px; line-height:1.5;}
  .opt.sel{border-color:#f59e0b; background:#fff7e8; font-weight:700;}
  .opt b{display:block; font-size:15px; margin-bottom:2px;}
  .opt small{color:var(--sub); font-size:12.5px; font-weight:400;}
  .field{margin-top:12px;}
  .field label{display:block; font-size:13px; font-weight:700; margin-bottom:5px;}
  /* iOS 사파리는 글씨가 16px보다 작으면 입력할 때 화면을 확대해 버린다 */
  input,textarea,select{width:100%; padding:12px 13px; border:2px solid var(--line);
    border-radius:12px; font-size:16px; font-family:inherit; background:#fff; color:var(--ink);}
  input:focus,textarea:focus{outline:none; border-color:#f59e0b;}
  textarea{min-height:88px; resize:vertical; line-height:1.6;}
  .warn{margin-top:12px; background:#fef2f2; color:var(--red); font-size:12.8px;
    border-radius:12px; padding:11px 13px; line-height:1.65; border-left:4px solid var(--red);}
  .note{margin-top:12px; background:#fff7e8; color:var(--amber); font-size:12.8px;
    border-radius:12px; padding:11px 13px; line-height:1.65;}
  .err{color:var(--red); font-size:13px; margin-top:9px; min-height:17px; font-weight:600;}
  .nav{display:flex; gap:8px; margin-top:16px;}
  .nav .btn{margin-top:0;}
  .nav .back{flex:0 0 92px; background:#f3f4f6; color:var(--sub); box-shadow:none; font-size:14px;}
  .sum{background:#f9fafb; border-radius:14px; padding:14px; margin-top:12px; font-size:14px; line-height:1.85;}
  .sum b{color:var(--amber);}
  .foot{text-align:center; font-size:11.5px; color:#fff; opacity:.75; margin-top:16px; line-height:1.7;}
</style>
</head>
<body>
<div class="app">
  <div class="who" id="who"></div>
  <div class="card" id="view"></div>
  <div class="foot" id="foot"></div>
</div>

<iframe name="gf" id="gf" style="display:none"></iframe>
<form id="gform" target="gf" method="POST" style="display:none"></form>

<script>
/* ===== 설정 읽기 =====
   주소 형식: 조사.html?c=<base64url(JSON)>
   JSON: { f:"폼ID", e:[번호,이름,유형,1지망,학과,2지망,이유,선생님께], t:"○○중 3학년 1반", r:"비평준화" } */
function b64dec(s){
  s = String(s).replace(/-/g,"+").replace(/_/g,"/");
  while(s.length % 4) s += "=";
  const bin = atob(s), bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
let CFG = null, CFG_ERR = "";
try{
  const raw = new URLSearchParams(location.search).get("c");
  if(!raw) CFG_ERR = "주소에 설정이 없습니다.";
  else{
    const o = JSON.parse(b64dec(raw));
    if(!o.f || !Array.isArray(o.e) || o.e.length < 8) CFG_ERR = "설정이 온전하지 않습니다.";
    else CFG = { f:String(o.f), e:o.e.map(String), t:o.t||"", r:(o.r==="평준화"?"평준화":"비평준화") };
  }
}catch(err){ CFG_ERR = "설정을 읽지 못했습니다."; }

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isPY = () => CFG && CFG.r === "평준화";

const KEY = CFG ? "jinhak_survey_" + CFG.f : "jinhak_survey_none";
let st = { step:0, num:"", name:"", type:"", s1:"", m1:"", s2:"", reason:"", ask:"", done:false };
try{ const d = localStorage.getItem(KEY); if(d) st = Object.assign(st, JSON.parse(d), {step:0}); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} };

const TYPES = [
  {k:"일반고", e:"🏫", d:"보통 교과를 두루 배우고 대학 진학을 준비해."},
  {k:"특성화고", e:"🛠️", d:"학과를 골라 기술·실무를 배워. 취업도 진학도 가능해."},
  {k:"마이스터고", e:"⚙️", d:"분야별 명장을 키우는 학교. 전국에서 뽑고 보통 기숙사 생활이야."},
  {k:"과학고", e:"🔬", d:"수학·과학을 깊게 배워. 원서를 8월에 내서 제일 빨라."},
  {k:"외고·국제고", e:"🌏", d:"외국어와 국제 분야를 집중해서 배워. 면접이 있어."},
  {k:"자사고", e:"📚", d:"학교가 교육과정을 자유롭게 짜. 학비가 더 들어."},
  {k:"예술·체육고", e:"🎨", d:"실기시험을 봐. 준비 기간을 미리 계산해야 해."},
  {k:"미정", e:"🤔", d:"아직 안 정했어. 괜찮아, 지금부터 같이 찾아보자."}
];
const NEEDS_MAJOR = t => t === "특성화고" || t === "마이스터고";
const IS_EARLY = t => ["특성화고","마이스터고","과학고","예술·체육고"].indexOf(t) >= 0;

function typeNote(t){
  if(t === "과학고")
    return {cls:"warn", s:"과학고는 <b>원서접수가 8월 24~28일</b>이야. 결정할 시간이 얼마 없으니 오늘 안에 선생님·부모님과 이야기하자."};
  if(t === "외고·국제고" || t === "자사고")
    return isPY()
      ? {cls:"note", s:"우리는 <b>평준화 지역</b>이라 일반고에 <b>동시지원이 가능</b>해. 다만 원서에 <b>1지망을 이 학교로</b> 적고 <b>2지망부터 일반고</b> 순서를 써야 해. 순서를 꼭 확인하자."}
      : {cls:"warn", s:"⚠️ 우리는 <b>비평준화 지역</b>이야. 외고·국제고·자사고 지원자는 <b>평준화 지역 일반고에만</b> 동시지원할 수 있어서, <b>우리 지역 일반고와는 같이 지원할 수 없어.</b> 떨어지면 1월 추가모집으로 가야 해. 부모님과 꼭 상의하자."};
  if(IS_EARLY(t))
    return {cls:"note", s:"이 유형은 <b>전기모집</b>이라 일반고보다 먼저 뽑아. <b>딱 1개 학교</b>만 지원할 수 있고, 합격하면 후기 고등학교에는 지원할 수 없어. <b>떨어졌을 때 갈 학교</b>도 같이 생각해 두자."};
  if(t === "일반고")
    return isPY()
      ? {cls:"note", s:"우리는 <b>평준화 지역</b>이야. 학교가 나를 뽑는 게 아니라, 지망 순위를 적어 내면 <b>추첨으로 배정</b>받아. 1월에 배정 학교가 나와."}
      : {cls:"note", s:"우리는 <b>비평준화 지역</b>이야. 가고 싶은 고등학교 <b>한 곳에 직접 지원</b>하고, 그 학교가 <b>내신 200점 순서</b>로 뽑아."};
  return null;
}

const STEPS = 8;
function bar(n){
  let h = '<div class="prog">';
  for(let i=1;i<=STEPS;i++) h += '<span class="'+(i<=n?"on":"")+'"></span>';
  return h + "</div>";
}
function nav(backJs, nextLabel, nextJs){
  return '<div class="nav">'
    + (backJs ? '<button class="btn back" onclick="'+backJs+'">← 이전</button>' : "")
    + '<button class="btn" style="flex:1" onclick="'+nextJs+'">'+nextLabel+'</button></div>';
}
const gv = id => ($(id) ? $(id).value.trim() : "");

function keep(){
  if($("fNum")) st.num = gv("fNum");
  if($("fName")) st.name = gv("fName");
  if($("fS1")) st.s1 = gv("fS1");
  if($("fM1")) st.m1 = gv("fM1");
  if($("fS2")) st.s2 = gv("fS2");
  if($("fReason")) st.reason = gv("fReason");
  if($("fAsk")) st.ask = gv("fAsk");
  save();
}
function go(n){ keep(); st.step = n; render(); }
function pick(t){ keep(); st.type = t; save(); render(); }

function render(){
  const v = $("view");
  $("who").textContent = CFG && CFG.t ? CFG.t : "";
  $("foot").innerHTML = CFG
    ? "적어 준 내용은 담임 선생님만 봅니다.<br>2027학년도 고등학교 입학 · 경기도 기준"
    : "";

  if(CFG_ERR){
    v.innerHTML = '<span class="big">🔗</span><h1>주소가 올바르지 않아요</h1>'
      + '<p class="desc">선생님이 보내 주신 링크를 <b>그대로</b> 눌러야 열립니다.<br>'
      + '주소를 손으로 옮겨 적었다면 뒷부분이 잘렸을 수 있어요.<br><br>'
      + '선생님께 링크를 다시 받아 주세요.</p>'
      + '<p class="desc" style="font-size:12px; opacity:.7">(' + esc(CFG_ERR) + ')</p>';
    return;
  }

  const s = st.step;

  if(s === 0){
    v.innerHTML = '<span class="big">🧭</span><h1>나의 진로 여행</h1>'
      + '<p class="desc">고등학교를 어디로 갈지 함께 정리해 보는 시간이야.<br>'
      + '<b>아직 안 정했어도 괜찮아.</b> 지금 생각하는 대로 솔직하게 적으면 돼.<br><br>'
      + '5분이면 끝나. 적어 준 내용은 <b>담임 선생님만</b> 봐.</p>'
      + (st.done ? '<div class="note">이미 한 번 제출했어. 다시 하면 <b>새로 낸 내용</b>으로 선생님이 보게 돼.</div>' : "")
      + '<button class="btn" onclick="go(1)">시작하기 →</button>';
  }

  else if(s === 1){
    v.innerHTML = bar(1) + '<h2>먼저 네가 누구인지 알려줘 ✋</h2>'
      + '<div class="hint">선생님이 누구 자료인지 알아야 상담을 준비할 수 있어.</div>'
      + '<div class="field"><label>번호</label><input id="fNum" inputmode="numeric" maxlength="2" value="'+esc(st.num)+'" placeholder="예: 7"></div>'
      + '<div class="field"><label>이름</label><input id="fName" maxlength="10" value="'+esc(st.name)+'" placeholder="예: 김하늘"></div>'
      + '<div class="err" id="e1"></div>'
      + nav("go(0)", "다음 →", "next1()");
  }

  else if(s === 2){
    v.innerHTML = bar(2) + '<h2>어떤 고등학교를 생각하고 있어? 🎒</h2>'
      + '<div class="hint">지금 마음이 가장 가는 것 하나를 골라. 나중에 바뀌어도 괜찮아.</div>'
      + TYPES.map(t => '<button class="opt '+(st.type===t.k?"sel":"")+'" onclick="pick(\''+t.k+'\')">'
          + '<b>'+t.e+' '+t.k+'</b><small>'+t.d+'</small></button>').join("")
      + (function(){ const n = st.type ? typeNote(st.type) : null;
          return n ? '<div class="'+n.cls+'">'+n.s+'</div>' : ""; })()
      + '<div class="err" id="e2"></div>'
      + nav("go(1)", "다음 →", "next2()");
  }

  else if(s === 3){
    const need = NEEDS_MAJOR(st.type);
    v.innerHTML = bar(3) + '<h2>가고 싶은 학교가 있어? 🏫</h2>'
      + '<div class="hint">아직 없으면 비워 두고 넘어가도 돼. 정해지면 선생님께 말해 주면 돼.</div>'
      + '<div class="field"><label>1지망 학교</label><input id="fS1" maxlength="30" value="'+esc(st.s1)+'" placeholder="예: ○○고등학교"></div>'
      + (need
          ? '<div class="field"><label>1지망 학과</label><input id="fM1" maxlength="30" value="'+esc(st.m1)+'" placeholder="예: 베이커리학과">'
            + '<div class="hint" style="margin-top:6px">같은 학교라도 <b>학과마다 뽑는 점수가 달라.</b> 학과까지 정해 두면 좋아.</div></div>'
          : "")
      + '<div class="field"><label>2지망 학교 <span style="font-weight:400;color:#9ca3af">(선택)</span></label>'
      + '<input id="fS2" maxlength="30" value="'+esc(st.s2)+'" placeholder="1지망이 어려울 때 갈 학교"></div>'
      + (IS_EARLY(st.type) && !st.s2
          ? '<div class="warn">지금 고른 유형은 <b>1개교만</b> 지원할 수 있어. 떨어졌을 때 갈 학교를 <b>2지망</b>에 적어 두면 선생님이 같이 준비해 줄 수 있어.</div>'
          : "")
      + '<div class="err" id="e3"></div>'
      + nav("go(2)", "다음 →", "go(4)");
  }

  else if(s === 4){
    v.innerHTML = bar(4) + '<h2>왜 그곳에 마음이 갔어? 💭</h2>'
      + '<div class="hint">한두 문장이면 충분해. 이유를 적어 두면 흔들릴 때 다시 볼 수 있어.</div>'
      + '<div class="field"><textarea id="fReason" maxlength="300" placeholder="예: 제과제빵을 배우고 싶어서. 집에서 버스로 20분이라 다닐 만해서.">'+esc(st.reason)+'</textarea></div>'
      + nav("go(3)", "다음 →", "go(5)");
  }

  else if(s === 5){
    v.innerHTML = bar(5) + '<h2>선생님께 하고 싶은 말 💌</h2>'
      + '<div class="hint">궁금한 것, 걱정되는 것, 물어보고 싶은 것. 뭐든 괜찮아.<br>'
      + '선생님이 답을 준비해서 상담 때 이야기해 줄 거야.</div>'
      + '<div class="field"><textarea id="fAsk" maxlength="300" placeholder="예: 제 성적으로 갈 수 있을까요? 부모님과 생각이 달라서 고민이에요.">'+esc(st.ask)+'</textarea></div>'
      + nav("go(4)", "다음 →", "go(6)");
  }

  else if(s === 6){
    keep();
    const n = st.type ? typeNote(st.type) : null;
    v.innerHTML = bar(6) + '<h2>이렇게 적었어. 맞아? 📝</h2>'
      + '<div class="sum">'
      + '<b>'+esc(st.num)+'번 '+esc(st.name)+'</b><br>'
      + '희망 유형 — '+esc(st.type||"미정")+'<br>'
      + '1지망 — '+esc(st.s1||"아직 없음")+(st.m1?" "+esc(st.m1):"")+'<br>'
      + '2지망 — '+esc(st.s2||"아직 없음")+'<br>'
      + '이유 — '+esc(st.reason||"아직 안 적음")+'<br>'
      + '선생님께 — '+esc(st.ask||"없음")
      + '</div>'
      + (n ? '<div class="'+n.cls+'">'+n.s+'</div>' : "")
      + '<div class="err" id="e6"></div>'
      + nav("go(5)", "이대로 제출하기", "submitAll()");
  }

  else if(s === 7){
    v.innerHTML = '<span class="big">✅</span><h1>잘 받았어. 고마워!</h1>'
      + '<p class="desc">선생님이 네가 적어 준 내용을 읽고<br>상담 때 함께 이야기할 거야.<br><br>'
      + '<b>생각이 바뀌면 언제든 다시 제출해도 돼.</b><br>선생님은 가장 나중 것을 보게 돼.</p>'
      + '<div class="note">혹시 선생님이 <b>“안 왔다”</b>고 하시면, 이 화면에서 <b>[처음으로]</b>를 눌러 한 번 더 보내 줘.</div>'
      + '<button class="btn ghost" onclick="st.step=0;render()">처음으로</button>';
  }
}

function next1(){
  keep();
  const n = Number(st.num);
  if(!st.num || !st.name){ $("e1").textContent = "번호와 이름을 모두 적어 줘!"; return; }
  if(!Number.isInteger(n) || n < 1 || n > 99){ $("e1").textContent = "번호는 1~99 사이 숫자로 적어 줘!"; return; }
  go(2);
}
function next2(){
  if(!st.type){ $("e2").textContent = "하나를 골라 줘! 정하지 않았으면 '미정'을 고르면 돼."; return; }
  go(3);
}

function submitAll(){
  keep();
  const btns = document.querySelectorAll(".nav .btn");
  btns.forEach(b => { b.disabled = true; });
  const last = btns[btns.length-1]; if(last) last.textContent = "보내는 중...";

  const vals = [st.num, st.name, st.type || "미정", st.s1, st.m1, st.s2, st.reason, st.ask];
  const f = $("gform");
  f.action = "https://docs.google.com/forms/d/e/" + CFG.f + "/formResponse";
  f.innerHTML = "";
  CFG.e.forEach((id, i) => {
    const inp = document.createElement("input");
    inp.type = "hidden";
    inp.name = "entry." + id;
    inp.value = vals[i] == null ? "" : vals[i];
    f.appendChild(inp);
  });

  let finished = false;
  const done = (ok) => {
    if(finished) return; finished = true;
    if(ok){ st.done = true; st.step = 7; save(); render(); return; }
    // 시간만 지나고 응답이 없으면 전송되지 않은 것으로 본다
    btns.forEach(b => { b.disabled = false; });
    if(last) last.textContent = "다시 보내기";
    alert("아직 보내지 못했어 😢  인터넷 연결을 확인하고 [다시 보내기]를 눌러 줘. 계속 안 되면 선생님께 꼭 말해 줘!");
  };
  $("gf").onload = () => done(true);
  setTimeout(() => done(false), 9000);
  f.submit();
}

render();
</script>
</body>
</html>
